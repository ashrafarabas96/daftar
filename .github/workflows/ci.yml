# The name used to say "DAFTAR Phase 1 CI", which stopped being true at
# P2-S1 and had been misdescribing itself for seven slices: this workflow
# runs Phase 1 AND every accepted Phase 2 slice gate. A truthful name matters
# more here than anywhere else in the repository, because the run's name is
# what a reviewer reads in the checks list when deciding what a green tick
# covers. The JOB names are deliberately unchanged — they are what the
# required-checks configuration matches on.
name: DAFTAR CI

# A pull_request run checks out the PR merge commit (refs/pull/N/merge), not
# the branch head, so it is equivalent-tree evidence only. The push trigger on
# the long-lived phase branches gives every pushed head a run whose checkout is
# that exact SHA (Phase 3 corrective audit, E-1).
on:
  push:
    branches: [main, 'phase/**']
  pull_request:

env:
  NODE_VERSION: '24.12.x'

# Added by CI-RUNNER-01 (DR-17), when the heavy jobs ran on ONE self-hosted
# runner with a single job slot and two runs of the same ref queued behind each
# other for hours. DR-48 removed that runner and every job below is
# GitHub-hosted again, so the six now run in parallel and the queueing reason
# is gone. The rule stays because its other reason never depended on capacity:
# a push that replaces a head makes the older run's result evidence for a tree
# nobody will merge.
#
# The key deliberately includes `github.event_name`, so a `push` run and a
# `pull_request` run NEVER share a group and can never cancel each other.
# Superseding happens only within one event kind and one ref: a newer push to a
# branch cancels the older push run for that branch, and a new head on a pull
# request cancels the older run for that pull request.
#
# The DOUBLE RUN is therefore NOT suppressed, and must not be. This comment
# used to claim that suppressing it was the point, and an earlier fix made the
# key actually do it. Both were wrong, because the two runs are not duplicates:
# a `pull_request` run checks out the merge commit and is equivalent-tree
# evidence only, while the `push` run checks out the literal pushed SHA, and
# `docs/PHASE_3_FINAL_CORRECTIVE_AUDIT.md` closure requirement E-1 demands an
# exact-SHA run and names this trigger as what provides it. Merging the two
# groups under `cancel-in-progress` would let a pull-request event destroy that
# evidence, and a cancelled run is not evidence by this project's own rule.
#
# Keying pull requests on their NUMBER rather than the branch also keeps two
# pull requests opened from one head branch against different bases apart,
# which a branch-name key would have collapsed into one group.
#
# `main` is deliberately NOT exempted: its runs are serialised the same way,
# and the surviving run is always the newest head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. Workspace integrity — every declared workspace must exist; a missing
  #    workspace is a HARD FAILURE, never a skipped job.
  # -------------------------------------------------------------------------
  workspaces:
    # CI-RUNNER-01 (DR-17), SECOND ROUND. This job was meant to stay on
    # GitHub's machines as one of the light ones, and in 2026-10 it could not:
    # while the repository was PRIVATE and the account carried a payment block,
    # every GitHub-hosted job was refused before a runner was ever assigned,
    # and the API annotation said why, verbatim —
    #
    #   "The job was not started because recent account payments have failed
    #    or your spending limit needs to be increased."
    #
    # None of that holds now. The repository is public, GitHub-hosted minutes
    # are unmetered, and this job runs on `ubuntu-latest` — so do not read the
    # paragraph above as a reason to bring a self-hosted runner back. On a
    # public repository that is the one thing this workflow's decision record
    # forbids outright, because a fork's pull request would execute untrusted
    # code on the machine.
    #
    # Measured on run 40419719684: `workspaces` failed 3 seconds in with
    # `runner_name: ""` and zero steps, and because every other job declares
    # `needs: workspaces`, all five were `skipped` — including the two this
    # card had just moved to the self-hosted runner. Leaving the light jobs on
    # GitHub therefore does not keep them cheap, it stops the whole workflow.
    #
    # That is why CI-RUNNER-01 moved this job to a self-hosted runner, which is
    # not metered. DR-48 reversed the premise rather than the conclusion: a
    # PUBLIC repository gets unmetered GitHub-hosted minutes, so the billing
    # block that made the move necessary cannot recur here, and the job is
    # hosted again. Not one step changed by either move.
    runs-on: ubuntu-latest
    steps:
      # DR-18, item 5. A GitHub-hosted runner is a fresh virtual machine, so a
      # green run there also says the tree was clean. A self-hosted runner is
      # not disposable: `_work` is reused, and a job could pass on a file some
      # earlier run left behind — a build output, a generated migration, a
      # `release/` artefact, a stale `node_modules`. That would be a green tick
      # that proves nothing, which is worse than a red one.
      #
      # So the work folder is emptied before checkout, `.git` included, and
      # every job re-clones. `actions/checkout`'s own `clean` is not enough: it
      # cleans the repository it finds, and says nothing about anything outside
      # it or about a half-written checkout.
      #
      # The npm cache and the tool cache live in the runner's HOME, outside the
      # work folder, and are deliberately kept — they are content-addressed
      # inputs, not test state.
      #
      # It is one step with a shell branch rather than two steps with `if:`,
      # because an `if:` would leave a `skipped` step in every GitHub-hosted
      # run, and this project does not read `skipped` as evidence.
      - name: Empty the work folder before checkout (self-hosted is not disposable)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" != "self-hosted" ]; then
            echo "github-hosted: the machine is disposable, nothing to clean"
            exit 0
          fi
          test -n "${GITHUB_WORKSPACE:-}"
          # Refuse anything shallow or home-like before deleting. Two earlier
          # versions of this guard were each narrower than they claimed:
          # `/home/*/` demands a trailing slash, so a workspace that WAS the
          # runner user's home passed it; and `${GITHUB_WORKSPACE%/}` strips
          # exactly ONE slash, so `/home/laptop//` and `/home/laptop/..` still
          # got through. Both were found by running the arms, not by reading them.
          #
          # So the path is RESOLVED rather than trimmed: `pwd -P` collapses
          # repeated slashes, resolves `..` and symlinks, and returns an
          # absolute path with no trailing slash (except for `/` itself). The
          # directory is created first because creating one is not destructive.
          #
          # Under `set -euo pipefail` a failing `mkdir` or `cd` aborts the step
          # before the `case` is reached, so the failure is closed either way;
          # the `""` arm is kept as a belt, not because it is the mechanism.
          mkdir -p "$GITHUB_WORKSPACE"
          ws=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          case "$ws" in
            ""|/|/bin|/boot|/dev|/etc|/home|/lib|/opt|/proc|/root|/run|/srv|/sys|/tmp|/usr|/var)
              echo "refusing to wipe system path '$ws'"; exit 1 ;;
          esac
          if [ "$ws" = "${HOME%/}" ]; then
            echo "refusing to wipe the runner user's home $ws"; exit 1
          fi
          depth=$(printf '%s' "$ws" | awk -F/ '{print NF-1}')
          if [ "$depth" -lt 3 ]; then
            echo "refusing to wipe shallow path $ws (depth $depth, need 3+)"; exit 1
          fi
          # Everything below operates on `$ws`, the value the guard actually
          # checked. Deleting `$GITHUB_WORKSPACE` here instead would mean
          # validating one path and wiping another whenever the two differ.
          before=$(find "$ws" -mindepth 1 -maxdepth 1 | wc -l)
          find "$ws" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          after=$(find "$ws" -mindepth 1 -maxdepth 1 | wc -l)
          echo "work folder: $ws"
          echo "top-level entries removed: $before -> $after"
          test "$after" -eq 0
      - uses: actions/checkout@v4
      - name: Verify exact workspace set
        run: |
          set -e
          for ws in apps/api apps/web apps/admin packages/domain-core packages/accounting packages/inventory packages/shared-contracts packages/design-system; do
            test -f "$ws/package.json" || { echo "MISSING WORKSPACE: $ws"; exit 1; }
          done
          test -f apps/android/settings.gradle.kts || { echo "MISSING: apps/android (Gradle)"; exit 1; }
          node -e "
            const pkg = require('./package.json');
            const expected = ['apps/api','apps/web','apps/admin','packages/domain-core','packages/accounting','packages/inventory','packages/shared-contracts','packages/design-system'].sort();
            const actual = [...pkg.workspaces].sort();
            if (JSON.stringify(expected) !== JSON.stringify(actual)) {
              console.error('workspace mismatch', { expected, actual });
              process.exit(1);
            }
          "
          for ws in apps/api apps/web apps/admin packages/domain-core packages/accounting packages/inventory packages/shared-contracts packages/design-system; do
            name=$(node -p "require('./$ws/package.json').name")
            grep -q "\"node_modules/$name\"" package-lock.json || { echo "package-lock missing workspace $name"; exit 1; }
          done

  # -------------------------------------------------------------------------
  # 2. Backend: install, manifest, gate, static guards, format/lint/typecheck,
  #    unit + integration + security + DB-contract + golden + localization.
  # -------------------------------------------------------------------------
  backend:
    needs: workspaces
    # CI-RUNNER-01 (DR-17). This is the heaviest job in the workflow — 442 of
    # the 789 billable minutes measured on 2026-10-26, 56% of the total — and
    # it is the one whose evidence the phase gates depend on. It now runs on
    # the owner's own machine, in a WSL2 Ubuntu 24.04 runner labelled
    # `daftar-wsl`.
    #
    # Nothing else in this job changed: not a step, not a gate, not a
    # `--max-warnings`, not the Lint heap ceiling, not the service container.
    # The `services:` block below still brings up a throwaway `postgres:16`
    # through Docker and still publishes 5432, so every `psql
    # postgres://postgres:postgres@localhost:5432/...` in the steps resolves
    # exactly as it did on `ubuntu-latest`.
    # BROWSER-IMAGE-26, and DR-86. GitHub rolled `ubuntu-latest` from 24.04 to
    # 26.04 and the pinned `playwright-core` had no Chromium for the new image,
    # so this job skipped named gates. The image is therefore NAMED here rather
    # than inherited, and the version named is the one MEASURED to work: on
    # `measure/browser-26-04`, `playwright-core@1.60.0` on ubuntu-26.04 failed at
    # the install step with zero bytes fetched (run 41785016875), and `1.61.0` on
    # the same image installed chromium v1228 and passed every gate with zero
    # skipped (run 41778343752). The difference is one dependency at one minor.
    #
    # 26.04 and not 24.04: the P4 lane measured the PERF01 tail nine times. It
    # appears in all five 24.04 measurements (max 43.7 to 311 ms) and in zero of
    # 800 samples on 26.04. So 24.04 is where the defect lives, not the cure.
    #
    # Nothing else moves with it: no budget, no sample count, no timeout, no
    # retry, no `continue-on-error`.
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # TD-24 / DR-90 §5 — the narrow exception, authorised only after PR #44
      # merged, and only here: this job and no other.
      #
      # WHY IT EXISTS. The shared rate-limit store is a Lua body that Redis
      # runs, and the identity limiter's connection patch is ioredis handshake
      # behaviour. Neither can be measured by a fake: `FakeRedis.eval` does
      # not interpret Lua, and a fake that agreed with a wrong script would
      # agree in silence. Without this container `tests/security/
      # td24-redis-live.test.ts` cannot run, and TD-24's acceptance would rest
      # on NOT_RUN — which is what the evidence said in those words until this
      # line existed.
      #
      # The image is PINNED to a minor, like `postgres:16` above: a floating
      # tag would make a later green run a statement about a different server
      # than the one acceptance was read on.
      #
      # It changes nothing else: no step, no gate, no budget, no timeout, no
      # `continue-on-error`, and no rate limit. A job that does not read
      # `REDIS_URL` is unaffected by a container being up.
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # DR-18, item 5. A GitHub-hosted runner is a fresh virtual machine, so a
      # green run there also says the tree was clean. A self-hosted runner is
      # not disposable: `_work` is reused, and a job could pass on a file some
      # earlier run left behind — a build output, a generated migration, a
      # `release/` artefact, a stale `node_modules`. That would be a green tick
      # that proves nothing, which is worse than a red one.
      #
      # So the work folder is emptied before checkout, `.git` included, and
      # every job re-clones. `actions/checkout`'s own `clean` is not enough: it
      # cleans the repository it finds, and says nothing about anything outside
      # it or about a half-written checkout.
      #
      # The npm cache and the tool cache live in the runner's HOME, outside the
      # work folder, and are deliberately kept — they are content-addressed
      # inputs, not test state.
      #
      # It is one step with a shell branch rather than two steps with `if:`,
      # because an `if:` would leave a `skipped` step in every GitHub-hosted
      # run, and this project does not read `skipped` as evidence.
      - name: Empty the work folder before checkout (self-hosted is not disposable)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" != "self-hosted" ]; then
            echo "github-hosted: the machine is disposable, nothing to clean"
            exit 0
          fi
          test -n "${GITHUB_WORKSPACE:-}"
          # Refuse anything shallow or home-like before deleting. Two earlier
          # versions of this guard were each narrower than they claimed:
          # `/home/*/` demands a trailing slash, so a workspace that WAS the
          # runner user's home passed it; and `${GITHUB_WORKSPACE%/}` strips
          # exactly ONE slash, so `/home/laptop//` and `/home/laptop/..` still
          # got through. Both were found by running the arms, not by reading them.
          #
          # So the path is RESOLVED rather than trimmed: `pwd -P` collapses
          # repeated slashes, resolves `..` and symlinks, and returns an
          # absolute path with no trailing slash (except for `/` itself). The
          # directory is created first because creating one is not destructive.
          #
          # Under `set -euo pipefail` a failing `mkdir` or `cd` aborts the step
          # before the `case` is reached, so the failure is closed either way;
          # the `""` arm is kept as a belt, not because it is the mechanism.
          mkdir -p "$GITHUB_WORKSPACE"
          ws=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          case "$ws" in
            ""|/|/bin|/boot|/dev|/etc|/home|/lib|/opt|/proc|/root|/run|/srv|/sys|/tmp|/usr|/var)
              echo "refusing to wipe system path '$ws'"; exit 1 ;;
          esac
          if [ "$ws" = "${HOME%/}" ]; then
            echo "refusing to wipe the runner user's home $ws"; exit 1
          fi
          depth=$(printf '%s' "$ws" | awk -F/ '{print NF-1}')
          if [ "$depth" -lt 3 ]; then
            echo "refusing to wipe shallow path $ws (depth $depth, need 3+)"; exit 1
          fi
          # Everything below operates on `$ws`, the value the guard actually
          # checked. Deleting `$GITHUB_WORKSPACE` here instead would mean
          # validating one path and wiping another whenever the two differ.
          before=$(find "$ws" -mindepth 1 -maxdepth 1 | wc -l)
          find "$ws" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          after=$(find "$ws" -mindepth 1 -maxdepth 1 | wc -l)
          echo "work folder: $ws"
          echo "top-level entries removed: $before -> $after"
          test "$after" -eq 0
      # Full history: the corrective gate runs the explicit Phase 3 secret
      # range scan from 0f2b09e7… and the full review-index check, and
      # neither can reach the Phase 3 base from a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # DR-98. PERF01's budgets A and B are asserted on the time PostgreSQL
      # spent EXECUTING (pg_stat_statements), not on the client's wall clock,
      # so the `postgres` service container needs the library preloaded. A
      # service container's command cannot be overridden from the `services:`
      # block above, so it is enabled here: ALTER SYSTEM, restart THAT
      # container, wait for it, and then READ the settings back. The read-back
      # is the positive control: a restart that came up without the library
      # fails this step by name instead of surfacing later as a suite that
      # cannot measure. It sits before every step that uses the database
      # (the first is "Create DAFTAR database", which creates `daftar` AFTER
      # this restart) and uses `docker exec`, so it depends on no client
      # installed on the runner.
      - name: Enable pg_stat_statements on the postgres service (PERF01 in-database budgets)
        run: |
          set -euo pipefail
          cid=$(docker ps --filter "publish=5432" --filter "ancestor=postgres:16" -q)
          # Exactly one container, named: an empty id, or two, is not a service
          # we may restart.
          test -n "$cid"
          test "$(printf '%s\n' "$cid" | grep -c .)" -eq 1
          dsql() { docker exec "$cid" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tA -c "$1"; }
          dsql "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$cid" >/dev/null
          ready=0
          for i in $(seq 1 60); do
            if docker exec "$cid" pg_isready -U postgres -d postgres >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          # The library's own parameters do not exist as parameters until the
          # library is loaded: measured on PR #48's first run, where
          # `ALTER SYSTEM SET pg_stat_statements.track` before the restart
          # failed with `unrecognized configuration parameter`. So they are set
          # AFTER the restart and applied with a reload, not a second restart.
          dsql "ALTER SYSTEM SET pg_stat_statements.track = 'top'"
          dsql "ALTER SYSTEM SET pg_stat_statements.track_utility = 'on'"
          # `pg_stat_statements.max` IS LEFT AT THE SERVER DEFAULT (5 000), AND
          # THAT IS A MEASURED DECISION, NOT AN OVERSIGHT. Raising it to 50 000
          # was tried, and the two runs are each other's control:
          #
          #   max=5000  (c5bbf8b2, job 128184300110): instrument cost per arm
          #             p50 32.516 / 32.995 ms, `P4-F over HTTP` under its
          #             100 ms ceiling, zero evictions.
          #   max=50000 (8f3219b1, job 128284370050): instrument cost per arm
          #             p50 386.358 / 383.384 ms -- TWELVE TIMES -- and
          #             `P4-F over HTTP` p95 447.823 / 444.677 ms against 100,
          #             with min 422, so the whole distribution moved, not a
          #             tail. Zero evictions there too.
          #
          # The cause is read from the code, not guessed: the instrument's two
          # reads sum `total_exec_time` across the view and sit INSIDE the HTTP
          # window by design (`receivables-s4-budgets.test.ts` says so and
          # prints the cost), so a ten-times-larger table makes the budget that
          # DR-98 deliberately left on the wall clock ten times more expensive.
          # Trading a rare eviction for a certain inflation of a judged budget
          # is a worse measurement, so the table stays small and the eviction
          # question is answered where it belongs: per measured WINDOW, in
          # `tests/helpers/in-database-time.ts`, which refuses a window that
          # lost an entry instead of reporting its figure.
          dsql "SELECT pg_reload_conf()" >/dev/null
          # Read back from the server, not assumed from what was written.
          libs=$(dsql "SHOW shared_preload_libraries")
          track=$(dsql "SHOW pg_stat_statements.track")
          utility=$(dsql "SHOW pg_stat_statements.track_utility")
          # Printed for monitoring, asserted as nothing: the value is the
          # server's own default and this step does not set it.
          pgssmax=$(dsql "SHOW pg_stat_statements.max")
          echo "shared_preload_libraries=$libs track=$track track_utility=$utility max=$pgssmax"
          test -n "$libs"
          printf '%s' "$libs" | grep -q 'pg_stat_statements'
          test "$track" = "top"
          test "$utility" = "on"
          # And through the published port, which is where every later step
          # looks. A bash TCP open, not `pg_isready`: the client packages are
          # installed by a later step and this one must not depend on them.
          timeout 10 bash -c 'exec 3<>/dev/tcp/127.0.0.1/5432'
      - run: npm ci
      - name: Build contract, accounting and design-system packages
        # typecheck/lint of apps/web and apps/admin resolve @daftar/design-system
        # from its built dist/ — an unbuilt package fails them with TS2307.
        # @daftar/accounting is on the same footing since P2-S3: the API's
        # posting module imports it by package name, so the integration and
        # security suites cannot even load without its dist/.
        # domain-core must be built before accounting, which depends on it.
        # @daftar/inventory joins them in P3-S1: the merchant API mints the
        # invctl/1 inventory command assertion through it by package name.
        run: |
          npm run build -w packages/domain-core -w packages/shared-contracts -w packages/design-system
          npm run build -w packages/accounting
          npm run build -w packages/inventory
      - name: Migration manifest check
        run: npm run check:migrations
      # The three historical invariants, on every push: the accepted Phase 2
      # prefix 0000–0052, the accepted Phase 3 prefix 0053–0073 and the Phase 4
      # floor stay byte-identical, and later migrations are permitted. All three
      # run in seconds with no database. Until P3-S9 the Phase 2 one ran only
      # inside `gate:phase2:release`, which no workflow on the Phase 3 branch runs.
      - name: Phase 2 migration prefix
        run: npx tsx scripts/phase2-prefix.ts
      - name: Phase 3 migration prefix
        run: npx tsx scripts/phase3-prefix.ts
      # Phase 4 (P4-AL-60): the inherited history 0000–0073 is intact and
      # `frozenThrough` is a FLOOR at it. It asserts nothing about a file after
      # 0073, so it is already true today, with no `0074` in the tree, and stays
      # true when `0074` lands. Each Phase 4 acceptance commit appends that
      # slice's accepted digests to the module, and the same checks then protect
      # them. `[[daftar-a-closure-rule-is-not-an-invariant]]`.
      - name: Phase 4 migration prefix
        run: npm run phase4-prefix
      - name: Phase 1 machine gate
        run: npm run gate:phase1
      - name: Static guards
        run: npm run check:guards
      - name: Localization check
        run: npm run check:localization
      - name: Format
        run: npm run format
      # `eslint . --max-warnings 0` walks the whole monorepo in one process and
      # died here with a V8 "Ineffective mark-compacts near heap limit" abort
      # (exit 134) against a ~2057MB ceiling. It is the fourteenth step of this
      # job, so its abort left steps 15-36 `skipped` — Typecheck, the unit
      # tests, the fresh PostgreSQL bring-up, the migrations, the integration
      # and security suites, the golden regression suite, every Phase 2 slice
      # gate, the Phase 3 corrective gate and the API build. A memory ceiling
      # was silently standing in for all of that evidence.
      #
      # Raising the ceiling for THIS STEP ONLY is the honest fix. The runner has
      # far more memory than 6144MB, so nothing here is oversubscribed. What is
      # deliberately NOT done: narrowing what Lint covers, lowering
      # --max-warnings, or adding ignore entries. Each of those would turn a
      # resource limit into permanently unreported lint errors, which is the
      # opposite of what a gate is for.
      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # §55–56: a FRESH PostgreSQL starts from ZERO — database + roles first (no
      # manually prepared database), then migrations, then a no-op second pass,
      # then the test suites run against THAT database (PG_PORT=5432 makes the
      # test harness reuse the service instead of an embedded instance).
      - name: Install PostgreSQL 16 from the PGDG archive, pinned, for the deployment-authority cluster
        run: |
          set -euo pipefail
          # DR-91. WHY, measured: ubuntu-26.04 ships PostgreSQL 18.6 where
          # ubuntu-24.04 shipped 16.15 -- read from each image's own
          # runner-images readme, each serving as the other's positive
          # control. The deployment-authority script starts its OWN
          # throw-away cluster out of /usr/lib/postgresql/16/bin
          # (scripts/phase2-deployment-authority.ts:98), so on 26.04 that
          # path is absent, the spawn fails ENOENT, and the script printed
          # `failed (signal)` only because it reports `res.status ?? 'signal'`.
          # Measured on run 41823029477: ONE root failure in backend step 34
          # that cascaded P3-S1..P3-S6 -> the corrective gate -> P4-S1 FAIL (2),
          # with PERF01 never reached and so never measured.
          #
          # DEPLOY_PG_BIN is NOT changed and no gate is touched: the version
          # the gate names is the version installed, and 16.15 is the same
          # minor the 24.04 image carried.
          #
          # The `services:` postgres:16 container owns port 5432, and every
          # `psql ...localhost:5432` step in this job resolves to it. Debian
          # packaging would create and START a host cluster on 5432 too, so
          # cluster creation is switched off BEFORE the install rather than a
          # cluster being dropped after one has already bound a port.
          sudo install -d -m 0755 /etc/postgresql-common
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          # The signing key is fetched from postgresql.org over HTTPS into a
          # keyring named for this one source, and the source list is written
          # only after the key is in place. No piped installer script, and
          # nothing is fetched from the archive before it is signed-by that key.
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          # A keyring of zero bytes is not a key: dearmor of an error page
          # would otherwise leave a file that `apt` rejects much later, with a
          # message about the archive rather than about this step.
          test -s /usr/share/keyrings/pgdg.gpg
          # `resolute` is not a guess: the packages in that suite are versioned
          # pgdg26.04, which is what ties it to this image.
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt resolute-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          # Exact versions, never a loose `postgresql-16`: a pin that has gone
          # from the archive must fail loudly here instead of installing
          # whatever is newest.
          sudo apt-get install -y --no-install-recommends \
            postgresql-16=16.15-1.pgdg26.04+2 \
            postgresql-client-16=16.15-1.pgdg26.04+2

      - name: PostgreSQL 16 is where the gate looks, and the container still owns 5432
        run: |
          set -euo pipefail
          test -x /usr/lib/postgresql/16/bin/initdb
          /usr/lib/postgresql/16/bin/initdb --version
          # The major is read out of that output rather than trusted from the
          # package name, and compared as a number this step names.
          v=$(/usr/lib/postgresql/16/bin/initdb --version | grep -oE "[0-9]+" | head -1)
          echo "initdb major = $v"
          test -n "$v"
          test "$v" = "16"
          # And a positive control that the install was HARMLESS -- stated about
          # rows this step can NAME, never about a total. A count is a fact
          # about its identity and not about the tree: this image carries its
          # OWN PostgreSQL 18 cluster, measured as `18 main 5432 down`, which
          # was there before this job and is not this step's to judge. The
          # first writing of this check asserted zero clusters outright and
          # went red on that pre-existing row -- caught by the control itself,
          # which is the whole reason a control is written.
          pg_lsclusters
          rows=$(pg_lsclusters | tail -n +2 | grep -c . || true)
          echo "host clusters listed = $rows"
          # Non-empty first: a listing that printed nothing at all would let
          # both counts below pass vacuously.
          test "$rows" -ge 1
          # 1. This install created no cluster of its own, which is what
          #    create_main_cluster = false is for -- proven by looking.
          sixteen=$(pg_lsclusters | tail -n +2 | awk '$1 == 16' | grep -c . || true)
          echo "version-16 clusters = $sixteen (must be 0)"
          test "$sixteen" -eq 0
          # 2. And nothing host-side is serving, so the container is what
          #    answers on 5432: every listed cluster must be down.
          online=$(pg_lsclusters | tail -n +2 | awk '$4 != "down"' | grep -c . || true)
          echo "clusters not down = $online (must be 0)"
          test "$online" -eq 0
          pg_isready -h localhost -p 5432 -U postgres
      - name: Create DAFTAR database + DB roles (fresh PostgreSQL from zero)
        run: |
          set -e
          psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE daftar" >/dev/null
          npm run bootstrap:db-roles
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
          APP_DB_PASSWORD: test_app_password_123
          PLATFORM_DB_PASSWORD: test_platform_password_123
          WORKER_DB_PASSWORD: test_worker_password_123
          RESOLVER_DB_PASSWORD: test_resolver_password_123
          IDENTITY_DB_PASSWORD: test_identity_password_123
          PROVISIONER_DB_PASSWORD: test_provisioner_password_123
          RECONCILER_DB_PASSWORD: test_reconciler_password_123
          # Deployment, not runtime: the non-superuser migration principal.
          MIGRATOR_DB_PASSWORD: test_migrator_password_123
      - name: Fresh database migrate (0000 → latest)
        run: npm run migrate -w @daftar/api
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Re-migrate latest → no-op
        run: npm run migrate -w @daftar/api
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Migration history verify
        run: npm run verify:history
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Integration + security tests
        run: npm run test:integration
        env:
          PG_PORT: '5432'
          # TD-24 / DR-90 §5. Without this the live suite skips and TD-24's
          # acceptance would rest on NOT_RUN. It reaches the application
          # through `createTestApp`'s existing `configOverrides` seam, so
          # `tests/helpers/test-app.ts` — owned by PR #7 and frozen by DR-89 —
          # is not touched. Only the two TD-24 suites read it; every other
          # suite keeps the in-process store it had, which is the premise
          # `tests/performance/pos-s3-budgets.test.ts` depends on and which
          # this job does not run.
          REDIS_URL: redis://localhost:6379
      - name: Golden regression suite
        run: npm run test:golden
        env:
          PG_PORT: '5432'
      # Phase 2 slice gate: structural boundary checks (migration numbers,
      # frozen history, no journal/posting surface, the 21-key registry, guard
      # G-3) plus the composed P2-S1 suites. A gate that only runs locally is a
      # gate that drifts.
      - name: Phase 2 slice gate — P2-S1
        run: npm run gate:phase2:s1
        env:
          PG_PORT: '5432'
      # P2-S2 keeps P2-S1 as a permanent predecessor and adds the journal
      # structural core: the migration boundary (0042 + 0043, nothing after),
      # no P2-S3 posting surface, both deferred validators, bidirectional
      # deferred bindings, unconditional immutability, guards G-1/G-2/G-3, and
      # the live privilege and invariant matrices.
      - name: Phase 2 slice gate — P2-S2
        run: npm run gate:phase2:s2
        env:
          PG_PORT: '5432'
      # P2-S3 keeps P2-S2 (and through it P2-S1 and Phase 1) as permanent
      # predecessors and adds the secure posting engine: 0044/0045 present and
      # still candidates, no 0046, the assertion key domain, the primitive's
      # protections and its single-role EXECUTE surface (guard G-4), the
      # @daftar/accounting workspace with the shared acctfp/1 vectors, key
      # separation from provisioning, and the posting, concurrency, parity,
      # authority and engine-shape matrices.
      - name: Phase 2 slice gate — P2-S3
        run: npm run gate:phase2:s3
        env:
          PG_PORT: '5432'
      # P2-S4 keeps the whole chain above as permanent predecessors and adds
      # the three accounting-native sources: 0046/0047 present, nothing beyond
      # them, both still candidates; the source tables and commands; no
      # reversal marker on the journal; physical uniqueness for reversals and
      # posted opening balances; supersession only after a reversal; G-4
      # widened to protect EVERY journal writer; no bypass seam; exactly three
      # merchant endpoints; and the source, concurrency, authority and upgrade
      # matrices.
      - name: Phase 2 slice gate — P2-S4
        run: npm run gate:phase2:s4
        env:
          PG_PORT: '5432'
      # P2-S5 keeps the whole chain above as permanent predecessors and adds
      # the FX rate foundation: 0048 frozen at its accepted digest, on disk and
      # in the manifest; the append-only registry with its composite ownership,
      # currency references and four physical rules; a lookup that never
      # invents a reciprocal, a cross-rate or an implicit 1; the second,
      # domain-separated acctctl/1 assertion format; one elevated write path
      # granted to the merchant runtime alone; the clock audit over the whole
      # migration; the pure realized-FX and rounding primitives; and the
      # registry, authority, concurrency, HTTP, parity, upgrade and portability
      # matrices. It has no opinion about a later authorized migration.
      - name: Phase 2 slice gate — P2-S5
        run: npm run gate:phase2:s5
        env:
          PG_PORT: '5432'
      # P2-S6 keeps the whole chain above as permanent predecessors and adds
      # accounting periods: 0049 present, still a candidate and the last
      # migration with no 0050; civil-date boundaries, a closed status
      # vocabulary and a REAL gist EXCLUDE for non-overlap, with btree_gist
      # installed by bootstrap rather than by widening the migration
      # principal; no DELETE path, no boundary move and no identity exemption;
      # a closed-period refusal that lives in a trigger on journal_entries and
      # activates nothing until a merchant creates their first period; two
      # permissions where reopen is never implied by manage; an operation
      # registry that decides a replay before any state is read; one lock
      # order, business before period, on the command path and the posting
      # path alike; a mandatory reopen reason that is audited and never
      # published; and the period, parity, concurrency, HTTP, authority,
      # upgrade and portability matrices.
      - name: Phase 2 slice gate — P2-S6
        run: npm run gate:phase2:s6
        env:
          PG_PORT: '5432'
      # P2-S7 — the financial reads. Proves that every reported figure is
      # aggregated from the journal at read time and nothing is stored; that
      # no report writes, pages by OFFSET, renders today's exchange rate over
      # yesterday's posting, hides a deactivated account's history, or turns
      # an amount into a double; that a whole-business trial balance balances
      # exactly or is refused; that `accounting.view` and Phase 1 branch scope
      # guard all six routes; and that each figure equals an independent
      # recomputation from the journal rows. Composes the P2-S6 gate, and
      # through it the whole chain back to Phase 1.
      - name: Phase 2 slice gate — P2-S7
        run: npm run gate:phase2:s7
        env:
          PG_PORT: '5432'
      # P2-S8 — the hardening and reconciliation slice, and the first gate in
      # this workflow that runs the performance budgets rather than reading
      # somebody's file. It proves: the migration boundary (0051 and 0052 are
      # candidates, nothing is frozen past 0050, there is no 0053); that 0052
      # reshapes exactly the six authorized policies and replaces exactly the
      # three helpers, creating and granting nothing; that the composite
      # foreign keys the corrected policies stand on are never dropped,
      # disabled or left NOT VALID anywhere in the history; the reconciler's
      # authority, process isolation and read-only privilege model; that the
      # test runner can still report failure, asked OUTSIDE Vitest before any
      # test result in the run is trusted; that the exit-code guard is not
      # merely present but installed through globalSetup; supply-chain
      # hygiene; and the six budgets at Tier 1.
      #
      # It composes the P2-S7 gate, which composes the whole chain back to
      # Phase 1. The predecessor step above is NOT removed for that reason:
      # when a predecessor breaks, a reviewer should see WHICH one failed in
      # the step list rather than having to read the log of a gate that
      # contains all of them.
      #
      # WHAT THIS STEP DELIBERATELY DOES NOT COVER: Tier 2 at a hundred
      # thousand and a million lines, the rollback/restore rehearsal, and the
      # before/after RLS answer equivalence. Those are hours of work on a real
      # cluster and they live in `phase2-s8-evidence.yml`, run at an exact SHA
      # and uploading their artefacts. A green tick here is a true statement
      # about this commit's structure and its per-push measurements, and
      # nothing more — which is the distinction that was missing.
      - name: Phase 2 slice gate — P2-S8
        run: npm run gate:phase2:s8
        env:
          PG_PORT: '5432'
      # The P4-S1 slice gate, which REPLACES the Phase 3 corrective-gate step
      # here and composes it FIRST — the same relationship the corrective gate
      # itself has to the P3-S8 step it replaced, and for the same reason: the
      # newest gate runs its predecessor as its first stream, so wiring both
      # would run the corrective gate's real-browser matrix, its full ar/en/tr
      # × phone/tablet/desktop pass and Budget A twice in one job.
      #
      # Through the predecessor it therefore still runs: the permanent P3-S8
      # gate (0069 frozen at S8_ACCEPTED; the reconciler grants, the R-B1a
      # guard, the definer law, the reconciliation reads, the S8 suites and
      # T-13) and through that P3-S7 … P3-S1, P2-S8 and the chain back to Phase
      # 1; then every corrected blocker — the corrective migration boundary,
      # the corrective suites, the review-index check, the full Phase 3 secret
      # range scan, the real-browser red proof, the browser matrix, and Budget
      # A last.
      #
      # On top of that it adds P4-S1's own streams: the three migration
      # prefixes (0000-0073 byte for byte, the candidate boundary, and the
      # permanent module that bounds nothing), the four Phase 4 goldens, the
      # guard red proofs, the declared deferred seams, composite-FK presence
      # and validity, the schema lint and numbering isolation.
      #
      # It is wired in the commit that COMPLETES the slice, and not earlier:
      # while a slice is open the gate reports a FAIL for every stream that has
      # not landed, which is correct for the gate and wrong for a workflow job,
      # because a job that is red by design cannot show a real regression
      # appearing. The corrective gate was wired while still red and this is
      # the lesson taken from that, not a departure from it — the verdict is
      # read either way, it is simply read from the point where it can still
      # say something new.
      #
      # An entry the coordinator has not filled is a FAIL, not a skip.
      # CHROMIUM-NET-01. `--with-deps` is two fetches in one: apt pulls the
      # font and library packages, and the pinned playwright-core downloads the
      # browser build. Both crossed the network in EVERY run, and on 2026-11-11
      # the apt half took a whole run down: run 43023156012 lost its `backend`
      # job after nine minutes of `Temporary failure resolving
      # 'security.ubuntu.com'` over ten rounds, for ten FONT packages, on a
      # commit whose only difference from a green one was four `.md` files. So
      # the tree was not the cause, and nothing here is a `retry`, a
      # `continue-on-error` or a raised timeout: what is removed is the per-run
      # dependency on the network. The step still runs, still installs the same
      # packages named by the same pinned playwright-core, and still fails if
      # either half fails.
      #
      # The key is the pinned `playwright-core` version — the dependency list
      # and the browser build are both functions of it — and the runner's own
      # `ImageOS`, because a different image has a different preinstalled
      # baseline and therefore a different MISSING set. The exact image build is
      # PRINTED and not keyed: keying it would miss the cache on every weekly
      # image roll, while a baseline change inside one `ImageOS` is handled
      # below by refilling the cache rather than by trusting it.
      - name: Chromium install inputs (pinned playwright-core, runner image)
        id: chromium-inputs
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing an unreadable playwright-core version: '$version'" >&2; exit 1 ;;
          esac
          echo "playwright-core: $version"
          echo "runner image: ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset}"
          test -n "${ImageOS:-}"
          echo "key=chromium-${ImageOS}-pw${version}-v1" >> "$GITHUB_OUTPUT"
      - name: Restore the Chromium build (nothing is downloaded on a hit)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-inputs.outputs.key }}-browser
      - name: Restore the Chromium apt dependencies as .deb archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromium-deb
          key: ${{ steps.chromium-inputs.outputs.key }}-deb
      - name: Install Chromium for the gate's real-browser matrix
        env:
          DEB_DIR: ${{ runner.temp }}/chromium-deb
        run: |
          set -euo pipefail
          mkdir -p "$DEB_DIR"
          # The missing set is named by the pinned playwright-core itself, never
          # hand-written here: `install-deps --dry-run` simulates the install
          # with `apt-get install -s`, which reads the image's OWN package lists
          # and reaches no network, and exits non-zero while anything is
          # missing. Its own documented words, from the pinned version: `On
          # Linux, simulate the install via apt-get and exit with a non-zero
          # code if any required packages are missing`. So the same command at
          # the end of this step is the verdict on it, and the `|| true` here is
          # on the LISTING only — the verdict below carries no `|| true`.
          missing=$(npx playwright-core install-deps --dry-run chromium || true)
          printf '%s\n' "$missing"
          pkgs=$(printf '%s\n' "$missing" | sed -n 's/^  \([a-z][a-z0-9.+:-]*\)$/\1/p')
          if [ -z "$pkgs" ]; then
            echo "every apt dependency is already present on this image: nothing to fetch"
          elif [ -f "$DEB_DIR/.list" ] && [ "$(cat "$DEB_DIR/.list")" = "$pkgs" ]; then
            debs=$(find "$DEB_DIR" -maxdepth 1 -name '*.deb' | wc -l)
            echo "cache hit: installing $debs cached .deb archive(s) from disk, no apt fetch"
            test "$debs" -gt 0
            sudo dpkg -i "$DEB_DIR"/*.deb
          else
            # A miss, or an image whose baseline moved under the same key. The
            # archives are fetched ONCE and then installed from disk. This is
            # the only arm that touches the network, and it is the FIRST fill of
            # the cache rather than a second attempt at anything.
            echo "cache fill: fetching $(printf '%s\n' "$pkgs" | wc -l) archive(s) once"
            rm -rf "$DEB_DIR"
            mkdir -p "$DEB_DIR"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only \
              -o Dir::Cache::archives="$DEB_DIR" $pkgs
            sudo chown -R "$(id -u):$(id -g)" "$DEB_DIR"
            find "$DEB_DIR" -mindepth 1 -maxdepth 1 -type d -exec rm -rf -- {} +
            sudo dpkg -i "$DEB_DIR"/*.deb
            printf '%s\n' "$pkgs" > "$DEB_DIR/.list"
          fi
          # playwright-core's own verdict, taken AFTER the install: a non-zero
          # exit here means a dependency is still missing, and the step fails.
          npx playwright-core install-deps --dry-run chromium
          # The browser build. On a cache hit this reports it as already
          # installed and downloads nothing.
          npx playwright-core install chromium
      - name: Phase 4 slice gate — P4-S1 (composes the Phase 3 corrective gate)
        run: npm run gate:phase4:s1
        env:
          PG_PORT: '5432'
          BROWSER_PG_DIR: ${{ runner.temp }}/corrective-browser-pg
          # The range scan's head: the PR head on a pull_request run (the
          # checkout is GitHub's merge commit), the pushed SHA on a push run.
          PHASE3_SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # TL-P4-S2-R3 — REQUIRED-CI CHAIN COMPOSITION. The P4-S2 gate is a DELTA
      # gate: it does not re-execute the ~50-minute P4-S1 predecessor inside
      # itself. The composition the Architecture Lock requires is satisfied
      # HERE instead, by this job: P4-S1 runs immediately above, P4-S2 runs
      # immediately below, both VISIBLE and both REQUIRED, in that order, in
      # the one required `backend` job. Neither step may carry
      # `continue-on-error`, and neither may carry an `if:` — a step that can
      # skip on an ordinary push or pull_request is not a gate.
      #
      # That arrangement is not a convention anybody has to remember: it is
      # asserted structurally, by parsing THIS file, in
      # `tests/guards/required-ci-chain-composition.test.ts`, which also plants
      # each way of breaking it (the step removed, the two reordered,
      # `continue-on-error` added, an `if:` added, the command changed) and
      # requires the check to go red on every one. Reordering these two steps
      # or moving either out of this job fails that suite.
      #
      # `A green workflow is not evidence for a gate the workflow never ran.`
      - name: Phase 4 slice gate — P4-S2
        run: npm run gate:phase4:s2
        env:
          # The same database environment as every other gate step in this job:
          # PG_PORT=5432 makes the test harness reuse the `postgres` service
          # above instead of starting an embedded instance.
          PG_PORT: '5432'
      # TL-P4-S2-R3, continued for P4-S3. The chain the Architecture Lock
      # requires is composed HERE, by this job: P4-S1, then P4-S2, then P4-S3,
      # all three VISIBLE and all three REQUIRED, in that order. The P4-S3
      # gate is a delta gate like its predecessor — it does not re-execute
      # P4-S2 inside itself — so the order of these steps IS the composition,
      # and this step may carry neither `continue-on-error` nor any `if:`.
      #
      # That is not a convention anybody has to remember: it is asserted
      # structurally, by parsing THIS file, in
      # `tests/guards/required-ci-chain-composition.test.ts`, which plants each
      # way of breaking it (this step removed, renamed, reordered before its
      # predecessors, given `continue-on-error`, given an `if:`, its command
      # changed, or moved into another job) and requires the check to go red on
      # every one. That suite is itself on the P4-S3 gate's roster, so the gate
      # executes the evidence for its own place in this job.
      #
      # `A green workflow is not evidence for a gate the workflow never ran.`
      - name: Phase 4 slice gate — P4-S3
        run: npm run gate:phase4:s3
        env:
          # The same database environment as every other gate step in this job:
          # PG_PORT=5432 makes the test harness reuse the `postgres` service
          # above instead of starting an embedded instance.
          PG_PORT: '5432'
      # P4-S3's READ BUDGET, NAMED IN THIS FILE.
      #
      # `tests/performance/pos-s3-budgets.test.ts` holds P4-A's `p95 <= 150 ms`
      # and P4-B's `p95 <= 60 ms`, the two plan-shape claims P4-AL-71 states.
      # The P4-S3 gate step above does execute that file — its
      # `roster-execution` check derives the roster FROM THE TREE at run time
      # and hands all fourteen suites to one bounded Vitest run. But a roster
      # derived at run time is invisible to anything that reads this file, and
      # `tests/performance/plan-evidence-contract.test.ts` must be able to
      # prove from the text that required CI executes every plan-shape claim.
      # What it was finding instead was one sentence in a comment inside
      # `scripts/phase4-s3-gate.ts` that happens to name the file — so the law
      # was green for a reason that would survive the execution going away.
      # This step makes the reach readable, and holds if the gate's derivation
      # rule ever stops matching the file. Roughly 30 s of a two-hour job.
      - name: POS read budgets — P4-A and P4-B, measured
        run: npx vitest run tests/performance/pos-s3-budgets.test.ts
        env:
          # The same database environment as every other gate step in this job:
          # PG_PORT=5432 makes the test harness reuse the `postgres` service
          # above instead of starting an embedded instance.
          PG_PORT: '5432'
      # The P4-S4 measured suites, named HERE because the plan-evidence
      # contract resolves reachability by reading this file: a suite that
      # holds a plan-shape claim and is executed by no step of the required
      # job is a claim nothing in CI ever checks, which is the exact shape of
      # the P4-S3 defect. The budgets suite runs through its own npm script,
      # the same command the slice is measured with locally, so CI and the
      # local round are not approximations of one another.
      - name: Receivables read budgets — P4-D and P4-F, measured
        run: npm run perf:phase4:s4
        env:
          PG_PORT: '5432'
      - name: Set-based AR answer equivalence — the 0083/0084 readers against the per-invoice original
        run: npx vitest run tests/performance/receivables-ar-setbased-equivalence.test.ts
        env:
          PG_PORT: '5432'
      # `0084`'s own correctness evidence. It was in NO step of this job and
      # in no `test*` script CI runs — `perf:phase2:s8` is the only script
      # covering `tests/performance` and nothing runs it — so a 40 KB suite
      # holding the open-invoice page's equivalence claim was never executed
      # anywhere. That is exactly the shape the comment above describes, found
      # by the gate's own `evidence-coverage` law rather than by reading.
      - name: Open-invoice page equivalence — the 0084 page reader against the per-invoice original
        run: npx vitest run tests/performance/receivables-open-page-equivalence.test.ts
        env:
          PG_PORT: '5432'
      # TL-P4-S2-R3, continued for P4-S4 — the customer-settlement slice.
      # The chain is composed HERE, by this job: P4-S1, P4-S2, P4-S3, then
      # P4-S4, all VISIBLE and all REQUIRED, in that order. P4-S4 is a delta
      # gate like its predecessors — it does not re-execute P4-S3 inside
      # itself — so the order of these steps IS the composition, and this step
      # carries neither `continue-on-error` nor any `if:`, exactly like the
      # steps around it.
      #
      # The previous slice shipped a gate that was in no required job at all,
      # so every green tick reported for it was green for a workflow that
      # never ran it. That is not a convention anybody has to remember here:
      # the P4-S4 gate's own `required-ci` check PARSES THIS FILE, and
      # `tests/guards/p4s4-required-ci.test.ts` plants each way of breaking it
      # (this step removed, renamed, reordered before P4-S3, given
      # `continue-on-error`, given an `if:`, its command changed, or moved
      # into another job) on a mutated copy of this text and requires the
      # check to go red on every one. That suite is on the P4-S4 gate's own
      # roster, which the gate EXECUTES — so the gate executes the evidence
      # for its own place in this job.
      #
      # `A green workflow is not evidence for a gate the workflow never ran.`
      - name: Phase 4 slice gate — P4-S4
        run: npm run gate:phase4:s4
        env:
          # The same database environment as every other gate step in this job:
          # PG_PORT=5432 makes the test harness reuse the `postgres` service
          # above instead of starting an embedded instance.
          PG_PORT: '5432'
      # TL-P4-S3-R5. The process composition guard's PLANTED-DEFECT PROOF.
      # It writes an unattached `@Controller()` into `apps/api/src/`, then
      # registers a merchant controller in the platform runtime, and requires
      # the guard to exit non-zero on each — reading the verdict off the
      # spawn result object, never through a pipe — before restoring the tree
      # and requiring green again. `A planted-defect proof that cannot be
      # shown failing is not a proof`, so the proof runs here on every push
      # and pull request rather than being asserted once by hand.
      # `required-ci-chain-composition.test.ts` (C-9) asserts this step's
      # presence, its command, its job and the absence of
      # `continue-on-error` / `if:`.
      - name: Process composition guard — planted-defect red proof
        run: npm run proof:composition:red
        env:
          # The same database environment as every other gate step in this
          # job: the guard's suite runs under the root Vitest config, whose
          # global setup reuses the `postgres` service at PG_PORT=5432.
          PG_PORT: '5432'
      # TL-P4-S3-R4. THE PLAN-EVIDENCE CONTRACT. Every plan-shape assertion the
      # tree declares is discovered from the tree, and each one must be
      # reachable from this job; the contract also MEASURES the cluster it ran
      # against — `server_version_num`, `datcollate`, `datctype`, the locale
      # provider — and records whether that cluster is a deployment-equivalent
      # one rather than a byte-order collation that answers `^@` differently.
      # `A plan-shape claim made on a different server major or collation is
      # not automatically a claim about deployment`: here the claim is made on
      # the `postgres:16` service the product deploys against, so the P4-S3
      # barcode defect could not have survived a single push.
      # `required-ci-chain-composition.test.ts` (C-9) asserts this step's
      # presence, command, job, name and the absence of
      # `continue-on-error` / `if:`.
      # TL-P4-S3-R4, the half the contract below could only REPORT. The S7
      # reference-model suite asserts on SQL text it derives from the
      # specification, so the discovery rule classifies those assertions as
      # plan gates by taint — correctly: they are assertions on
      # plan-shape-signalled text. It lives in a workspace, so `npm test` in
      # the `workspaces` job ran it and this job never did, and the contract
      # below named it unreached. Required CI now executes it HERE too. It
      # opens no database: 144 cases, measured, from the tree alone — the
      # root-scoped invocation is what makes the package's own
      # `include: test/**` resolve, which a root-config run does not.
      - name: Phase 4 S7 reference-model plan claims (packages/domain-core, no database)
        run: npx vitest run --root packages/domain-core test/phase4-s7-installment-aging.test.ts
      - name: Plan-evidence contract
        run: npm run plan-evidence:contract
        env:
          # PG_PORT=5432 makes the contract REUSE the `postgres` service above
          # and start nothing, so what it measures is the environment the
          # required job's own gates ran on — not a cluster of its own.
          PG_PORT: '5432'
      # TL-P4-S3-R4, the half a structural contract cannot state:
      # `Do not hard-code a spelling without first measuring what CI's
      # PostgreSQL service reports`. The step above proves every plan claim is
      # REACHABLE from this job; this one MEASURES the server the job reached
      # it on and prints the measurement into the log —
      # `server_version_num`, `datcollate`, `datctype`, the locale provider and
      # the derived byte-order verdict — then exits non-zero unless that server
      # is a deployment-equivalent one. Without it the environment behind every
      # plan-shape PASS in this job is recorded nowhere, which is how the P4-S3
      # barcode gate stayed green for months on a collation the product does
      # not deploy on. It measures and starts nothing: the service is already
      # listening, and `--measure` never calls `initdb`.
      # `required-ci-chain-composition.test.ts` (C-9) asserts this step's
      # presence, command, job, name and the absence of
      # `continue-on-error` / `if:`.
      - name: Plan-evidence target measurement
        run: npm run plan-evidence:target -- --measure
        env:
          # The `postgres` service of this job, by the name this script reads.
          PLAN_EVIDENCE_PG_PORT: '5432'
      - name: Keep the gate's browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrective-gate-browser-evidence
          path: |
            release/browser
            release/browser-red-proof
          if-no-files-found: ignore
          retention-days: 30
      - name: Tampered-migration hard-fail proof
        run: |
          set -e
          psql postgres://postgres:postgres@localhost:5432/daftar -c \
            "INSERT INTO schema_migrations(name, sha256) VALUES ('9999_foreign_tamper.sql', 'deadbeef')" >/dev/null
          if npm run verify:history; then
            echo "tampered history was ACCEPTED — gate broken"; exit 1
          fi
          psql postgres://postgres:postgres@localhost:5432/daftar -c \
            "DELETE FROM schema_migrations WHERE name='9999_foreign_tamper.sql'" >/dev/null
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      # ── THE PERFORMANCE BUDGETS' NEGATIVE CONTROLS (owner decision DR-74) ──
      #
      # A budget that cannot fail is not a budget, and until DR-74 nothing in
      # this workflow had ever made one fail. The accounting suite carried a
      # slowdown knob for its B budget alone, never set by CI; the POS suite
      # carried none at all. So every green tick those budgets ever reported
      # was green for an unknown reason: a measurement that cannot go red and
      # a measurement that is passing look exactly alike from here.
      #
      # These two steps deliberately slow the measured point of each budget
      # and REQUIRE THE SUITE TO FAIL. A step that merely runs a suite with a
      # knob set is not a control — it is a second run.
      #
      # And failing is not enough either. A suite whose fixture cannot start,
      # whose database is unreachable, or that matches no test file also exits
      # non-zero, and a control satisfied by that would be green while the
      # budgets it claims to exercise were never evaluated. So each step also
      # requires the inverted run to have failed ON THE BUDGET'S OWN
      # ASSERTION, by its pure-ASCII tag — `PERF01-BUDGET-A`, `-B`, `-RATIO`,
      # `-P4A`, `-P4B`, each pinned in the suite beside the ceiling it guards.
      #
      # Neither step touches a ceiling: `60` ms, `15` ms, `150` ms and the
      # `1.6` ratio are the suites' own and are never raised to obtain a pass.
      # The knobs are unset in every other step of this job, and inert then.
      #
      # Why a shell block rather than a plain `npx vitest run …`:
      # `tests/performance/plan-evidence-contract.test.ts` proves that deleting
      # the step which MEASURES `pos-s3-budgets.test.ts` leaves that file
      # unreached by the required job. A control run — which demands the suite
      # fail — is not a measurement, and a second plain `npx` step naming the
      # same file would make that proof come back green with the measurement
      # gone. The shell form keeps the control honest and the proof's subject
      # intact; it is also the shape the tampered-migration proof above
      # already uses, for the same reason: the exit code has to be inverted.
      # DR-98. Budgets A and B are asserted on the time PostgreSQL spent
      # EXECUTING (pg_stat_statements), not on the client's wall clock, so the
      # two controls below have OPPOSITE required outcomes, and both run:
      #
      #   1. a delay planted INSIDE the database (`pg_sleep`, 200 ms, on a
      #      `daftar_app` connection, inside every measured window) must turn
      #      the suite red, ON the A and B assertions, by their tags;
      #   2. a delay planted OUTSIDE the database (`setTimeout`, 200 ms, around
      #      the query) must leave A and B GREEN. It used to be the control that
      #      had to fail the suite, back when the wall clock was the verdict.
      #
      # A step that merely runs a suite is not a control, and a pass is not
      # evidence of anything unless the run provably took place. So control 2
      # also reads the evidence file the run wrote (deleted first, so it cannot
      # be a leftover) and requires, for A and for B: the wall clock really WAS
      # inflated (p50 >= 200 ms) and the in-database p95 still sat inside its
      # own ceiling. Without those two reads a suite that matched no tests, or
      # a delay that never fired, would satisfy "it passed". The `-t` filter
      # runs only the A and B cases: the control is about them, and a flake in
      # C, D, E or F would be a failure of the control and not of anything it
      # claims to prove. The 200 ms of control 1 exceeds B's 60 ms ceiling on
      # purpose; a 50 ms delay would leave B green.
      - name: Budget negative control — a delay INSIDE the database must fail the accounting A and B budgets
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-accounting-in-db.log"
          if npx vitest run tests/performance/accounting-budgets.test.ts >"$log" 2>&1; then
            tail -80 "$log"
            echo "the in-database-SLOWED accounting budgets PASSED — A and B cannot fail on database time, so their green means nothing"; exit 1
          fi
          grep -q 'PERF01-BUDGET-A' "$log" || {
            tail -120 "$log"
            echo "the in-database-slowed run failed, but NOT on budget A's assertion — the control proves nothing about A"; exit 1
          }
          grep -q 'PERF01-BUDGET-B' "$log" || {
            tail -120 "$log"
            echo "the in-database-slowed run failed, but NOT on budget B's assertion — the control proves nothing about B"; exit 1
          }
        env:
          PG_PORT: '5432'
          PERF01_IN_DB_DELAY_MS: '200'
      - name: Budget negative control — a delay OUTSIDE the database must NOT fail the accounting A and B budgets
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-accounting-client-side.log"
          evidence=release/phase2-s8-performance-tier1.json
          rm -f "$evidence"
          if ! npx vitest run tests/performance/accounting-budgets.test.ts -t 'the posting command|the manual-adjustment endpoint' >"$log" 2>&1; then
            tail -120 "$log"
            echo "a CLIENT-SIDE delay failed the accounting A and B budgets — the verdict still listens to something outside PostgreSQL"; exit 1
          fi
          test -s "$evidence" || {
            tail -80 "$log"
            echo "the client-side-delayed run passed but wrote no evidence — it did not measure A and B"; exit 1
          }
          node -e '
            const e = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const want = [["A post() in an open transaction", 15], ["B manual adjustment endpoint", 60]];
            let bad = 0;
            for (const [name, ceiling] of want) {
              const m = e.measurements.find((x) => x.name === name);
              if (!m || !m.inDatabase) { console.log("MISSING in-database series for " + name); bad += 1; continue; }
              const ok = m.p50 >= 200 && m.inDatabase.p95 <= ceiling;
              console.log(name + ": wall p50 " + m.p50.toFixed(1) + " ms (must be >= 200), in-database p95 " + m.inDatabase.p95.toFixed(3) + " ms (ceiling " + ceiling + ")");
              if (!ok) bad += 1;
            }
            process.exit(bad === 0 ? 0 : 1);
          ' "$evidence" || {
            echo "the client-side control did not prove what it claims: either the delay never reached the wall clock or the in-database series missed its ceiling"; exit 1
          }
        env:
          PG_PORT: '5432'
          PERF01_NEGATIVE_CONTROL_MS: '200'
      - name: Budget negative control — the POS ratio gate and P4-A must be able to fail, and P4-B must NOT fail on a client-side delay
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-pos.log"
          if npx vitest run tests/performance/pos-s3-budgets.test.ts >"$log" 2>&1; then
            tail -80 "$log"
            echo "the SLOWED POS budgets PASSED — the ratio gate and P4-A/P4-B cannot fail, so their green means nothing"; exit 1
          fi
          for tag in PERF01-BUDGET-RATIO PERF01-BUDGET-P4A; do
            grep -q "$tag" "$log" || {
              tail -120 "$log"
              echo "the slowed run failed, but NOT on $tag's assertion — the control proves nothing about it"; exit 1
            }
          done
          # AND P4-B MUST NOT BE AMONG THEM, BY DESIGN. Its verdict is the time
          # PostgreSQL spent executing (DR-98), so a 200 ms delay planted in
          # the CLIENT must leave it green — if it fails here, the verdict is
          # still listening to something outside the database. This is the
          # negative half of the pair; the positive half is the next step.
          #
          # AN ABSENCE OF `PERF01-BUDGET-P4B` PROVES NOTHING ON ITS OWN: the
          # log is free of it as well when the instrument refused, when P4-B
          # never reached its verdict, or when the delay never reached the wall
          # clock — and this run is red by design, so one more red is not
          # visible. The checker requires the facts that give the absence its
          # meaning: P4-B printed its line, the wall clock saw the delay
          # (wallP50 >= 200), and the in-database p95 stayed under the ceiling
          # the line itself reports. Its logic is exercised, planted and
          # accepted, by tests-unit/p4b-client-delay-control.test.ts.
          npx tsx scripts/check-p4b-client-delay-log.ts "$log" || {
            tail -160 "$log"
            echo "the client-side control did not prove what it claims about P4-B"; exit 1
          }
        env:
          PG_PORT: '5432'
          POS_PERF_NEGATIVE_CONTROL_MS: '200'
      - name: Budget negative control — a delay INSIDE the database must fail P4-B
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-pos-in-db.log"
          # The positive half: 200 ms slept INSIDE the database on a
          # `daftar_app` connection, inside every measured window. A ceiling
          # nothing can breach is not a ceiling, so this step requires the NEW
          # verdict to go red, and to go red ON P4-B's own assertion.
          if npx vitest run tests/performance/pos-s3-budgets.test.ts -t 'P4-B' >"$log" 2>&1; then
            tail -80 "$log"
            echo "the in-database-SLOWED P4-B PASSED — it cannot fail on database time, so its green means nothing"; exit 1
          fi
          grep -q 'PERF01-BUDGET-P4B' "$log" || {
            tail -160 "$log"
            echo "the in-database-slowed run failed, but NOT on P4-B's assertion — the control proves nothing about P4-B"; exit 1
          }
          grep -q 'judgedOn' "$log" || {
            tail -160 "$log"
            echo "P4-B's failure message carries no judgedOn, so the log does not say which clock refused it"; exit 1
          }
          # The instrument must not be what broke: a BLIND or EVICTED clock
          # would also turn the suite red, and that red would prove nothing.
          ! grep -q 'PERF01-INSTRUMENT-' "$log" || {
            tail -160 "$log"
            echo "the instrument itself refused in the control run, so this red says nothing about the budget"; exit 1
          }
        env:
          PG_PORT: '5432'
          POS_PERF_IN_DB_DELAY_MS: '200'
      # DR-98, extended to the P4-S4 receivables budgets. `P4-D` and `P4-F`
      # in-transaction are now asserted on the time PostgreSQL spent EXECUTING
      # (pg_stat_statements), not on the client's wall clock, so the two
      # controls below have OPPOSITE required outcomes and BOTH run:
      #
      #   1. a delay planted INSIDE the database (`pg_sleep`, 200 ms, on a
      #      `daftar_app` connection, inside every measured window) must turn
      #      the suite red ON the two converted budgets' own assertions. 200 ms
      #      and not 50: it has to exceed the ceiling it is meant to break, and
      #      `P4-D`'s ceiling is 100 ms.
      #   2. a delay planted OUTSIDE the database (`setTimeout`, 200 ms, at the
      #      head of the same windows) must leave BOTH converted budgets green —
      #      and must turn `P4-F over HTTP` RED, because that budget is still
      #      judged on the wall clock by decision and the HTTP window CONTAINS
      #      the transaction window. That red is the control's second half, not
      #      its failure: it is the executable proof that the unconverted budget
      #      really was left unconverted.
      #
      # WHY THE MARKERS AND NOT THE PROSE. Each budget's assertion message opens
      # with a pure-ASCII `P4-S4-BUDGET-FAIL-<tag>` that appears if and only if
      # that assertion failed, and each verdict that HELD prints
      # `P4-S4-INDB-OK-<tag>` afterwards. Control 2's claim is an ABSENCE — the
      # two converted budgets did not fail — so it carries its own positive
      # control in the same log: the HTTP marker MUST be there, which proves the
      # grep can see a marker in this very run, and the `-INDB-OK-` lines MUST
      # be there, which proves the verdicts were actually reached. A run that
      # matched no test, or a delay that never fired, satisfies neither.
      #
      # `--reporter=verbose` is not decoration: MEASURED on Vitest 4.1.11, the
      # default reporter DROPS the `console.log` of a passing case, and every
      # monitor line a control reads is printed by a case that passes.
      #
      # Neither step touches a ceiling, an iteration count, a percentile or a
      # timeout, neither carries `continue-on-error` or an `if:`, and the knobs
      # are unset — and then inert — in every other step of this job. Neither
      # step names the measured npm script: that step is pinned by name and by
      # script body (`scripts/phase4-s4-gate.ts`, `S4_EVIDENCE_STEPS`) and must
      # appear in this job exactly once, so a control that reached the suite
      # through that script would make the measured step ambiguous.
      - name: Budget negative control — a delay INSIDE the database must fail the P4-D and P4-F-TXN budgets
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-receivables-in-db.log"
          if npx vitest run --reporter=verbose tests/performance/receivables-s4-budgets.test.ts >"$log" 2>&1; then
            tail -80 "$log"
            echo "the in-database-SLOWED receivables budgets PASSED — P4-D and P4-F-TXN cannot fail on database time, so their green means nothing"; exit 1
          fi
          test -s "$log" || { echo "the control produced no log at all, so nothing in it can be read as a result"; exit 1; }
          for tag in D-RECEIVABLE D-AGING D-OPENINVOICES FTXN-BASE-5 FTXN-FOREIGN-5; do
            grep -q "P4-S4-BUDGET-FAIL-$tag judgedOn=inDatabaseExecMs" "$log" || {
              tail -160 "$log"
              echo "the in-database-slowed run failed, but NOT on $tag's own in-database assertion — the control proves nothing about that budget"; exit 1
            }
          done
          grep -h 'P4-S4-MONITOR-' "$log" || true
        env:
          PG_PORT: '5432'
          P4_S4_IN_DB_DELAY_MS: '200'
      - name: Budget negative control — a delay OUTSIDE the database must NOT fail the P4-D and P4-F-TXN budgets
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-receivables-client-side.log"
          # The run is EXPECTED to fail, on the one budget this card left on the
          # wall clock and on that budget alone.
          if npx vitest run --reporter=verbose tests/performance/receivables-s4-budgets.test.ts >"$log" 2>&1; then
            tail -80 "$log"
            echo "a 200 ms CLIENT-SIDE delay left P4-F over HTTP green — that budget is judged on the wall clock, so this run proves the delay never reached it"; exit 1
          fi
          test -s "$log" || { echo "the control produced no log at all, so nothing in it can be read as a result"; exit 1; }
          # POSITIVE CONTROL for the absence claims below: the wall-clock budget
          # DID fail, in this log, so the marker grep can see a marker here.
          for tag in FHTTP-BASE-5 FHTTP-FOREIGN-5; do
            grep -q "P4-S4-BUDGET-FAIL-$tag judgedOn=wallClockClientMs" "$log" || {
              tail -160 "$log"
              echo "the client-side-delayed run did not fail on $tag — either the delay never fired or the marker is not in this log, and then every absence below is unmeasured"; exit 1
            }
          done
          # THE CLAIM: no converted budget failed, and each verdict was reached.
          for tag in D-RECEIVABLE D-AGING D-OPENINVOICES FTXN-BASE-5 FTXN-FOREIGN-5; do
            if grep -q "P4-S4-BUDGET-FAIL-$tag " "$log"; then
              tail -160 "$log"
              echo "a CLIENT-SIDE delay failed $tag — that budget's verdict still listens to something outside PostgreSQL"; exit 1
            fi
            grep -q "P4-S4-INDB-OK-$tag" "$log" || {
              tail -160 "$log"
              echo "$tag printed no P4-S4-INDB-OK line, so its verdict was never reached and its silence is not a pass"; exit 1
            }
          done
          # AND THE NUMBERS, not just the exit code: the wall clock really was
          # inflated by the delay, and the in-database series still sat inside
          # the ceiling. Read from the monitor lines the suite printed.
          grep -h 'P4-S4-MONITOR-' "$log" >"$RUNNER_TEMP/monitor.txt" || true
          test -s "$RUNNER_TEMP/monitor.txt" || { echo "no P4-S4-MONITOR line was printed, so neither figure can be read"; exit 1; }
          cat "$RUNNER_TEMP/monitor.txt"
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").split("\n").filter((l) => l.includes("P4-S4-MONITOR-"));
            const want = ["D-RECEIVABLE", "D-AGING", "D-OPENINVOICES", "FTXN-BASE-5", "FTXN-FOREIGN-5"];
            const num = (l, k) => Number((new RegExp(k + "=([0-9.]+)").exec(l) || [])[1]);
            let bad = 0;
            for (const tag of want) {
              const l = lines.find((x) => x.includes("P4-S4-MONITOR-" + tag + " "));
              if (l === undefined) { console.log("MISSING monitor line for " + tag); bad += 1; continue; }
              const wall = num(l, "wallP50"), inDb = num(l, "inDbP95"), ceiling = num(l, "budgetMs");
              const ok = wall >= 200 && inDb <= ceiling;
              console.log(tag + ": wall p50 " + wall + " ms (must be >= 200), in-database p95 " + inDb + " ms (ceiling " + ceiling + ")");
              if (!ok) bad += 1;
            }
            process.exit(bad === 0 ? 0 : 1);
          ' "$RUNNER_TEMP/monitor.txt" || {
            echo "the client-side control did not prove what it claims: either the delay never reached the wall clock or an in-database series missed its ceiling"; exit 1
          }
        env:
          PG_PORT: '5432'
          P4_S4_CLIENT_DELAY_MS: '200'
      # DR-98 EXTENDED TO `P4-AL-72`'s ALLOCATION SCALING RATIO (owner decision
      # 2026-11-07). BOTH halves of that quotient are now the IN-DATABASE
      # series, read from `pg_stat_statements` around the same transaction
      # windows, so the ratio has controls of its own and BOTH of them run.
      #
      # WHY IT CANNOT BORROW STEPS 54 AND 55. Step 54's knob plants its delay at
      # the head of EVERY measured window, so it adds the same `d` to the
      # numerator and to the denominator: `(a + d) / (b + d)` moves TOWARDS 1
      # and can never exceed `a / b`. Step 54 therefore CANNOT make this verdict
      # miss, and reading its green as this ratio's control would be reading a
      # control that never ran — the false negative RULE-27 and DR-55 are about.
      # `P4_S4_IN_DB_DELAY_MS_FIVE` plants the delay in the FIVE-INVOICE arm
      # alone, which is the one shape that raises a quotient.
      #
      # `-t 'P4-AL-72, OD-P4-14'` pins both runs to that single case. The string
      # is a literal with no regex metacharacter and it matches exactly ONE `it`
      # in the whole test tree (measured on this tree), so step A's red is that
      # case's red and not another budget's. The fixture still seeds and still
      # measures both arms in full; only the verdicts are filtered.
      #
      # Neither step touches a ceiling, a ratio constant, an iteration count, a
      # percentile or a timeout; neither carries `continue-on-error` or an `if:`;
      # and the knob is unset — and then inert — in every other step of this job.
      - name: Ratio negative control — a delay INSIDE the database in the FIVE-invoice arm alone must fail P4-AL-72
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-al72-numerator.log"
          if npx vitest run --reporter=verbose tests/performance/receivables-s4-budgets.test.ts -t 'P4-AL-72, OD-P4-14' >"$log" 2>&1; then
            tail -80 "$log"
            echo "a 200 ms pg_sleep planted in the NUMERATOR arm alone left P4-AL-72 green — then that ratio cannot fail on database time and its green means nothing"; exit 1
          fi
          test -s "$log" || { echo "the control produced no log at all, so nothing in it can be read as a result"; exit 1; }
          # POSITIVE CONTROL FOR THE RED: the case actually REACHED its verdict.
          # A `-t` that matched no test also exits non-zero, and a fixture that
          # died before the arms were measured does too — either would make the
          # red above unattributed.
          grep -q 'P4-S4-RATIO-MONITOR-AL72 depth=in-database judgedOn=inDatabaseExecMs' "$log" || {
            tail -160 "$log"
            echo "the run failed but printed no in-database ratio monitor line, so the P4-AL-72 case never reached its verdict and this red says nothing about it"; exit 1
          }
          # THE CLAIM: it failed on P4-AL-72's OWN assertion, by its own marker.
          grep -q 'P4-S4-RATIO-FAIL-AL72 judgedOn=inDatabaseExecMs' "$log" || {
            tail -160 "$log"
            echo "the run failed, but NOT on P4-AL-72's own in-database assertion — the control proves nothing about that ratio"; exit 1
          }
          if grep -q 'P4-S4-RATIO-OK-AL72' "$log"; then
            echo "the same run printed both the FAIL and the OK marker for P4-AL-72, so the markers do not distinguish a miss from a hold"; exit 1
          fi
          grep -h 'P4-S4-RATIO-MONITOR-AL72' "$log"
        env:
          PG_PORT: '5432'
          P4_S4_IN_DB_DELAY_MS_FIVE: '200'
      - name: Ratio negative control — a delay OUTSIDE the database must NOT fail P4-AL-72
        run: |
          set -e
          log="$RUNNER_TEMP/negative-control-al72-client-side.log"
          # ── WHY THIS STEP WAS REWRITTEN, MEASURED AND NOT SUPPOSED ────────
          #
          # It used to read `npx vitest ... || { echo "a 200 ms CLIENT-SIDE
          # delay failed the P4-AL-72 in-database ratio"; exit 1; }` — the
          # EXIT CODE as the ratio's verdict. That is false on this file by
          # construction: `auditTheRun` is a census of `DECLARED_CASES = 18`
          # and `-t` leaves 17 of them unrun, so a `-t` run of this file ALWAYS
          # exits non-zero whatever the ratio did. Measured: run 42431995284,
          # job 128582737049, step 59 — the ratio case RAN and PASSED (`Tests
          # 1 passed | 17 skipped`), the failure was `auditTheRun` at
          # `receivables-s4-budgets.test.ts:1595`, and the step printed a
          # sentence blaming the ratio for a red the ratio did not cause. Step
          # 58 reads the same non-zero code safely only because it gates on
          # `P4-S4-RATIO-FAIL-AL72` afterwards; this step had no such gate on
          # the path it actually took, so it never reached its own numeric
          # checks — RULE-1 exactly, and the control was unexecuted.
          #
          # SO THE EXIT CODE IS NO LONGER READ AS THE VERDICT. The markers are,
          # and the exit code must then AGREE with them: a non-zero code is
          # accepted only when the log proves the census — and nothing else —
          # is what failed. Nothing is skipped, and no failure is tolerated
          # without being named.
          set +e
          npx vitest run --reporter=verbose tests/performance/receivables-s4-budgets.test.ts -t 'P4-AL-72, OD-P4-14' >"$log" 2>&1
          rc=$?
          set -e
          test -s "$log" || { echo "the control produced no log at all, so nothing in it can be read as a result"; exit 1; }
          # A COPY WITH THE COLOUR BYTES REMOVED, because vitest's own tally
          # line is not contiguous text. Measured on run 42482725647, step 57:
          # every marker gate below passed and the census gate passed, and this
          # step still died on `Tests[[:space:]]+1 passed \| 17 skipped`,
          # because the reporter writes
          # `Tests \e[1m\e[32m1 passed\e[39m\e[22m\e[2m | \e[22m\e[33m17 skipped`
          # — the words are there and the ADJACENCY is not. That is RULE-20's
          # class: a pattern that cannot see escape sequences reports absence
          # where there is content. Stripping them changes no assertion; the
          # tally below still demands exactly `1 passed | 17 skipped`.
          plain="$RUNNER_TEMP/negative-control-al72-client-side.plain.log"
          sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$log" >"$plain"
          # POSITIVE CONTROL on the stripper itself: an empty or unwritten copy
          # would make every grep below report a clean absence (RULE-11).
          test -s "$plain" || { echo "the colour-stripped copy of the control log is empty, so nothing may be read from it"; exit 1; }
          # 1. THE CASE REACHED ITS VERDICT. No silent skip: a `-t` that matched
          #    nothing, or a fixture that died, leaves this line absent.
          grep -q 'P4-S4-RATIO-MONITOR-AL72 depth=in-database judgedOn=inDatabaseExecMs' "$log" || {
            tail -160 "$log"
            echo "the P4-AL-72 in-database case never reached its verdict (no judgedOn=inDatabaseExecMs monitor line), so this run says NOTHING about that ratio — an unexecuted control is a failure, never a pass"; exit 1
          }
          # 2. AND IT HELD.
          grep -q 'P4-S4-RATIO-OK-AL72' "$log" || {
            tail -160 "$log"
            echo "the P4-AL-72 case reached its verdict and did NOT print P4-S4-RATIO-OK-AL72, so a delay OUTSIDE the database moved an in-database quotient"; exit 1
          }
          if grep -q 'P4-S4-RATIO-FAIL-AL72' "$log"; then
            tail -160 "$log"
            echo "a 200 ms CLIENT-SIDE delay failed the P4-AL-72 in-database ratio by its own marker — that verdict still listens to something outside PostgreSQL"; exit 1
          fi
          # 3. THE EXIT CODE AGREES WITH THE MARKERS, by name on both branches.
          if [ "$rc" -eq 0 ]; then
            if grep -q 'declared cases did not run to a verdict' "$log"; then
              echo "the run exited 0 while the census reported unrun cases — the exit code and the audit disagree"; exit 1
            fi
          else
            grep -q '17 of 18 declared cases did not run to a verdict' "$log" || {
              tail -160 "$log"
              echo "the run exited $rc for something OTHER than the -t census of this file, and an unexplained red cannot be read as this control holding"; exit 1
            }
            grep -qE 'Tests[[:space:]]+1 passed \| 17 skipped' "$plain" || {
              tail -160 "$plain"
              echo "the run exited $rc and its own tally is not '1 passed | 17 skipped', so more than the census failed"; exit 1
            }
          fi
          # AND THE VERDICT IS PRINTED FROM THE LOG, not asserted in prose.
          echo "P4-AL-72 CLIENT-SIDE CONTROL — the verdict as the run itself recorded it:"
          grep -hE 'P4-S4-RATIO-OK-AL72|Tests[[:space:]]+[0-9]+ passed' "$plain"
          echo "wrapper exit code $rc, and the only failure in the log is the -t census (proven above, not assumed)"
          grep -h 'P4-S4-RATIO-MONITOR-AL72' "$log" >"$RUNNER_TEMP/al72-monitor.txt" || true
          test -s "$RUNNER_TEMP/al72-monitor.txt" || { echo "no P4-S4-RATIO-MONITOR-AL72 line was printed, so neither quotient can be read"; exit 1; }
          cat "$RUNNER_TEMP/al72-monitor.txt"
          # AND THE NUMBERS, not just the exit code: the client delay really did
          # reach the WALL figures of both arms, and the in-database quotient
          # stayed inside the constant while it did.
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(process.argv[1], "utf8").split("\n").filter((l) => l.includes("P4-S4-RATIO-MONITOR-AL72"));
            const num = (l, k) => Number((new RegExp(k + "=([0-9.]+)").exec(l) || [])[1]);
            const wall = lines.find((l) => l.includes("depth=in-transaction"));
            const indb = lines.find((l) => l.includes("depth=in-database"));
            let bad = 0;
            if (wall === undefined) { console.log("MISSING the in-transaction wall monitor line"); bad += 1; }
            else {
              const one = num(wall, "oneP95"), five = num(wall, "fiveP95");
              console.log("wall p95: 1-invoice " + one + " ms, 5-invoice " + five + " ms (both must be >= 200, or the client delay never fired)");
              if (!(one >= 200 && five >= 200)) bad += 1;
            }
            if (indb === undefined) { console.log("MISSING the in-database monitor line"); bad += 1; }
            else {
              const ratio = num(indb, "ratio"), max = num(indb, "max");
              console.log("in-database ratio " + ratio + " against the constant " + max);
              if (!(ratio > 0 && ratio <= max)) bad += 1;
            }
            process.exit(bad === 0 ? 0 : 1);
          ' "$RUNNER_TEMP/al72-monitor.txt" || {
            echo "the client-side ratio control did not prove what it claims: either the delay never reached the wall figures or the in-database quotient did not hold"; exit 1
          }
        env:
          PG_PORT: '5432'
          P4_S4_CLIENT_DELAY_MS: '200'
      - name: Database contract from zero (throw-away embedded server; same check as the release gate)
        run: npm run check:db-from-zero
      - name: API build
        run: npm run build -w @daftar/api

  # -------------------------------------------------------------------------
  # 3. Web + Admin builds.
  # -------------------------------------------------------------------------
  web-admin:
    needs: workspaces
    # CI-RUNNER-01 moved this to the self-hosted runner for the same measured
    # reason as `workspaces`; DR-48 moved it back for the same reason too.
    runs-on: ubuntu-latest
    steps:
      # DR-18, item 5. A GitHub-hosted runner is a fresh virtual machine, so a
      # green run there also says the tree was clean. A self-hosted runner is
      # not disposable: `_work` is reused, and a job could pass on a file some
      # earlier run left behind — a build output, a generated migration, a
      # `release/` artefact, a stale `node_modules`. That would be a green tick
      # that proves nothing, which is worse than a red one.
      #
      # So the work folder is emptied before checkout, `.git` included, and
      # every job re-clones. `actions/checkout`'s own `clean` is not enough: it
      # cleans the repository it finds, and says nothing about anything outside
      # it or about a half-written checkout.
      #
      # The npm cache and the tool cache live in the runner's HOME, outside the
      # work folder, and are deliberately kept — they are content-addressed
      # inputs, not test state.
      #
      # It is one step with a shell branch rather than two steps with `if:`,
      # because an `if:` would leave a `skipped` step in every GitHub-hosted
      # run, and this project does not read `skipped` as evidence.
      - name: Empty the work folder before checkout (self-hosted is not disposable)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.environment }}" != "self-hosted" ]; then
            echo "github-hosted: the machine is disposable, nothing to clean"
            exit 0
          fi
          test -n "${GITHUB_WORKSPACE:-}"
          # Refuse anything shallow or home-like before deleting. Two earlier
          # versions of this guard were each narrower than they claimed:
          # `/home/*/` demands a trailing slash, so a workspace that WAS the
          # runner user's home passed it; and `${GITHUB_WORKSPACE%/}` strips
          # exactly ONE slash, so `/home/laptop//` and `/home/laptop/..` still
          # got through. Both were found by running the arms, not by reading them.
          #
          # So the path is RESOLVED rather than trimmed: `pwd -P` collapses
          # repeated slashes, resolves `..` and symlinks, and returns an
          # absolute path with no trailing slash (except for `/` itself). The
          # directory is created first because creating one is not destructive.
          #
          # Under `set -euo pipefail` a failing `mkdir` or `cd` aborts the step
          # before the `case` is reached, so the failure is closed either way;
          # the `""` arm is kept as a belt, not because it is the mechanism.
          mkdir -p "$GITHUB_WORKSPACE"
          ws=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          case "$ws" in
            ""|/|/bin|/boot|/dev|/etc|/home|/lib|/opt|/proc|/root|/run|/srv|/sys|/tmp|/usr|/var)
              echo "refusing to wipe system path '$ws'"; exit 1 ;;
          esac
          if [ "$ws" = "${HOME%/}" ]; then
            echo "refusing to wipe the runner user's home $ws"; exit 1
          fi
          depth=$(printf '%s' "$ws" | awk -F/ '{print NF-1}')
          if [ "$depth" -lt 3 ]; then
            echo "refusing to wipe shallow path $ws (depth $depth, need 3+)"; exit 1
          fi
          # Everything below operates on `$ws`, the value the guard actually
          # checked. Deleting `$GITHUB_WORKSPACE` here instead would mean
          # validating one path and wiping another whenever the two differ.
          before=$(find "$ws" -mindepth 1 -maxdepth 1 | wc -l)
          find "$ws" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          after=$(find "$ws" -mindepth 1 -maxdepth 1 | wc -l)
          echo "work folder: $ws"
          echo "top-level entries removed: $before -> $after"
          test "$after" -eq 0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Contract + design-system builds
        # web/admin import runtime helpers from @daftar/shared-contracts (which
        # depends on @daftar/domain-core) — both must be built before Next.
        run: npm run build -w @daftar/domain-core -w @daftar/shared-contracts -w @daftar/design-system
      - name: Web build
        run: npm run build -w @daftar/web
      - name: Admin build
        run: npm run build -w @daftar/admin

  # -------------------------------------------------------------------------
  # 4. Android lint + unit test + assemble.
  # -------------------------------------------------------------------------

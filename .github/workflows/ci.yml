name: DAFTAR Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: '24.12.x'

jobs:
  # -------------------------------------------------------------------------
  # 1. Workspace integrity — every declared workspace must exist; a missing
  #    workspace is a HARD FAILURE, never a skipped job.
  # -------------------------------------------------------------------------
  workspaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact workspace set
        run: |
          set -e
          for ws in apps/api apps/web apps/admin packages/domain-core packages/accounting packages/shared-contracts packages/design-system; do
            test -f "$ws/package.json" || { echo "MISSING WORKSPACE: $ws"; exit 1; }
          done
          test -f apps/android/settings.gradle.kts || { echo "MISSING: apps/android (Gradle)"; exit 1; }
          node -e "
            const pkg = require('./package.json');
            const expected = ['apps/api','apps/web','apps/admin','packages/domain-core','packages/accounting','packages/shared-contracts','packages/design-system'].sort();
            const actual = [...pkg.workspaces].sort();
            if (JSON.stringify(expected) !== JSON.stringify(actual)) {
              console.error('workspace mismatch', { expected, actual });
              process.exit(1);
            }
          "
          for ws in apps/api apps/web apps/admin packages/domain-core packages/accounting packages/shared-contracts packages/design-system; do
            name=$(node -p "require('./$ws/package.json').name")
            grep -q "\"node_modules/$name\"" package-lock.json || { echo "package-lock missing workspace $name"; exit 1; }
          done

  # -------------------------------------------------------------------------
  # 2. Backend: install, manifest, gate, static guards, format/lint/typecheck,
  #    unit + integration + security + DB-contract + golden + localization.
  # -------------------------------------------------------------------------
  backend:
    needs: workspaces
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build contract, accounting and design-system packages
        # typecheck/lint of apps/web and apps/admin resolve @daftar/design-system
        # from its built dist/ — an unbuilt package fails them with TS2307.
        # @daftar/accounting is on the same footing since P2-S3: the API's
        # posting module imports it by package name, so the integration and
        # security suites cannot even load without its dist/.
        # domain-core must be built before accounting, which depends on it.
        run: |
          npm run build -w packages/domain-core -w packages/shared-contracts -w packages/design-system
          npm run build -w packages/accounting
      - name: Migration manifest check
        run: npm run check:migrations
      - name: Phase 1 machine gate
        run: npm run gate:phase1
      - name: Static guards
        run: npm run check:guards
      - name: Localization check
        run: npm run check:localization
      - name: Format
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # §55–56: a FRESH PostgreSQL starts from ZERO — database + roles first (no
      # manually prepared database), then migrations, then a no-op second pass,
      # then the test suites run against THAT database (PG_PORT=5432 makes the
      # test harness reuse the service instead of an embedded instance).
      - name: Create DAFTAR database + DB roles (fresh PostgreSQL from zero)
        run: |
          set -e
          psql postgres://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE daftar" >/dev/null
          npm run bootstrap:db-roles
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
          APP_DB_PASSWORD: test_app_password_123
          PLATFORM_DB_PASSWORD: test_platform_password_123
          WORKER_DB_PASSWORD: test_worker_password_123
          RESOLVER_DB_PASSWORD: test_resolver_password_123
          IDENTITY_DB_PASSWORD: test_identity_password_123
          PROVISIONER_DB_PASSWORD: test_provisioner_password_123
          # Deployment, not runtime: the non-superuser migration principal.
          MIGRATOR_DB_PASSWORD: test_migrator_password_123
      - name: Fresh database migrate (0000 → latest)
        run: npm run migrate -w @daftar/api
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Re-migrate latest → no-op
        run: npm run migrate -w @daftar/api
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Migration history verify
        run: npm run verify:history
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Integration + security tests
        run: npm run test:integration
        env:
          PG_PORT: '5432'
      - name: Golden regression suite
        run: npm run test:golden
        env:
          PG_PORT: '5432'
      # Phase 2 slice gate: structural boundary checks (migration numbers,
      # frozen history, no journal/posting surface, the 21-key registry, guard
      # G-3) plus the composed P2-S1 suites. A gate that only runs locally is a
      # gate that drifts.
      - name: Phase 2 slice gate — P2-S1
        run: npm run gate:phase2:s1
        env:
          PG_PORT: '5432'
      # P2-S2 keeps P2-S1 as a permanent predecessor and adds the journal
      # structural core: the migration boundary (0042 + 0043, nothing after),
      # no P2-S3 posting surface, both deferred validators, bidirectional
      # deferred bindings, unconditional immutability, guards G-1/G-2/G-3, and
      # the live privilege and invariant matrices.
      - name: Phase 2 slice gate — P2-S2
        run: npm run gate:phase2:s2
        env:
          PG_PORT: '5432'
      # P2-S3 keeps P2-S2 (and through it P2-S1 and Phase 1) as permanent
      # predecessors and adds the secure posting engine: 0044/0045 present and
      # still candidates, no 0046, the assertion key domain, the primitive's
      # protections and its single-role EXECUTE surface (guard G-4), the
      # @daftar/accounting workspace with the shared acctfp/1 vectors, key
      # separation from provisioning, and the posting, concurrency, parity,
      # authority and engine-shape matrices.
      - name: Phase 2 slice gate — P2-S3
        run: npm run gate:phase2:s3
        env:
          PG_PORT: '5432'
      # P2-S4 keeps the whole chain above as permanent predecessors and adds
      # the three accounting-native sources: 0046/0047 present, nothing beyond
      # them, both still candidates; the source tables and commands; no
      # reversal marker on the journal; physical uniqueness for reversals and
      # posted opening balances; supersession only after a reversal; G-4
      # widened to protect EVERY journal writer; no bypass seam; exactly three
      # merchant endpoints; and the source, concurrency, authority and upgrade
      # matrices.
      - name: Phase 2 slice gate — P2-S4
        run: npm run gate:phase2:s4
        env:
          PG_PORT: '5432'
      # P2-S5 keeps the whole chain above as permanent predecessors and adds
      # the FX rate foundation: 0048 present and still a candidate with no
      # 0049; the append-only registry with its composite ownership, currency
      # references and four physical rules; a lookup that never invents a
      # reciprocal, a cross-rate or an implicit 1; the second, domain-separated
      # acctctl/1 assertion format; one elevated write path granted to the
      # merchant runtime alone; the clock audit over the whole migration; the
      # pure realized-FX and rounding primitives; and the registry, authority,
      # concurrency, HTTP, parity, upgrade and portability matrices.
      - name: Phase 2 slice gate — P2-S5
        run: npm run gate:phase2:s5
        env:
          PG_PORT: '5432'
      - name: Tampered-migration hard-fail proof
        run: |
          set -e
          psql postgres://postgres:postgres@localhost:5432/daftar -c \
            "INSERT INTO schema_migrations(name, sha256) VALUES ('9999_foreign_tamper.sql', 'deadbeef')" >/dev/null
          if npm run verify:history; then
            echo "tampered history was ACCEPTED — gate broken"; exit 1
          fi
          psql postgres://postgres:postgres@localhost:5432/daftar -c \
            "DELETE FROM schema_migrations WHERE name='9999_foreign_tamper.sql'" >/dev/null
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/daftar
      - name: Database contract from zero (throw-away embedded server; same check as the release gate)
        run: npm run check:db-from-zero
      - name: API build
        run: npm run build -w @daftar/api

  # -------------------------------------------------------------------------
  # 3. Web + Admin builds.
  # -------------------------------------------------------------------------
  web-admin:
    needs: workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Contract + design-system builds
        # web/admin import runtime helpers from @daftar/shared-contracts (which
        # depends on @daftar/domain-core) — both must be built before Next.
        run: npm run build -w @daftar/domain-core -w @daftar/shared-contracts -w @daftar/design-system
      - name: Web build
        run: npm run build -w @daftar/web
      - name: Admin build
        run: npm run build -w @daftar/admin

  # -------------------------------------------------------------------------
  # 4. Android lint + unit test + assemble.
  # -------------------------------------------------------------------------
  android:
    needs: workspaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # `packages` is set explicitly: the action's default installs the obsolete
      # `tools` package, which no longer exists in the SDK repository and fails
      # the job before Gradle runs. The build needs platform 35 + build-tools
      # 35.0.0 (apps/android/app/build.gradle.kts compileSdk/targetSdk = 35).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Android lint + unit tests + assemble
        run: |
          cd apps/android
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          ./gradlew lint testDebugUnitTest assembleDebug --no-daemon --stacktrace

  # -------------------------------------------------------------------------
  # 5. Secret / dependency / artifact hygiene scans.
  # -------------------------------------------------------------------------
  hygiene:
    needs: workspaces
    runs-on: ubuntu-latest
    steps:
      # Full history: gitleaks scans the pull request's commit RANGE, so with the
      # default depth-1 checkout the base commit is absent, git writes to stderr
      # and the action fails having scanned ~0 bytes. Depth 0 makes the scan real.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Forbidden artifact scan
        run: |
          set -e
          bad=$(find . -path ./node_modules -prune -o -type f \( \
            -name '.env' -o -name '*.log' -o -name 'dev-mailbox*' -o \
            -name '*.tsbuildinfo' -o -name '*.pem' -o -name '*.key' -o \
            -name '*.zip' \) -print | grep -v node_modules || true)
          test -z "$bad" || { echo "FORBIDDEN ARTIFACTS:"; echo "$bad"; exit 1; }
          test ! -d apps/api/dist || { echo "stale apps/api/dist committed"; exit 1; }
      - name: Raw credential scan
        run: |
          set -e
          if grep -rInE 'argon2id\$[A-Za-z0-9+/=]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            apps packages infrastructure scripts --include='*.ts' --include='*.sql' \
            | grep -v 'static-guards' | grep -v 'export-release'; then
            echo "raw credential material found"; exit 1
          fi
      # GITHUB_TOKEN is REQUIRED by gitleaks-action v2 to scan a pull request;
      # without it the action exits non-zero before scanning anything.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
